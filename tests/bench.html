<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SnipeCam Bench</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; padding: 16px; background: #111; color: #eee; font: 15px/1.5 system-ui, sans-serif; }
    button, label.btn { display: inline-block; min-height: 44px; padding: 10px 14px; margin: 4px 4px 4px 0; border: 1px solid #333; border-radius: 10px; background: #1c1c1e; color: #eee; font: inherit; }
    pre { white-space: pre-wrap; background: #000; padding: 12px; border-radius: 8px; font-size: 13px; }
    video { width: 100%; max-height: 240px; object-fit: cover; background: #000; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>Detector benchmark</h1>
  <p>Measures face detection + embedding time per frame at each tile setting (T-DET-6/13). Keep the app closed while running.</p>
  <button id="btn-cam" disabled>Bench with camera</button>
  <label class="btn">Bench with photo… <input id="file" type="file" accept="image/*" hidden disabled></label>
  <video id="video" playsinline muted hidden></video>
  <pre id="out">Loading detector…</pre>
  <script type="module">
    import { initDetector, detect } from '../js/detector.js';
    import { startCamera, stopCamera } from '../js/camera.js';
    import { grabFrame } from '../js/capture.js';

    const out = document.getElementById('out');
    const print = (s) => { out.textContent += `\n${s}`; };
    const RUNS = 10;

    const t0 = performance.now();
    const backend = await initDetector({ backend: 'webgpu', maxDetected: 10, minFacePx: 20 });
    out.textContent = `Backend: ${backend} (loaded in ${((performance.now() - t0) / 1000).toFixed(1)} s)\n${navigator.userAgent}`;
    document.getElementById('btn-cam').disabled = false;
    document.getElementById('file').disabled = false;

    async function bench(label, getFrame) {
      print(`\n${label}`);
      for (const tiles of [1, 2, 3]) {
        const first = await getFrame();
        await detect(first.bitmap, { tiles }); // warm up this path
        first.bitmap.close();
        const times = [];
        let faces = 0;
        for (let i = 0; i < RUNS; i++) {
          const f = await getFrame();
          const s = performance.now();
          faces = (await detect(f.bitmap, { tiles })).length;
          times.push(performance.now() - s);
          f.bitmap.close();
        }
        times.sort((a, b) => a - b);
        const mean = times.reduce((a, b) => a + b) / times.length;
        print(`  tiles ${tiles === 1 ? 'off' : `${tiles}×${tiles}`}: mean ${mean.toFixed(0)} ms, median ${times[RUNS >> 1].toFixed(0)} ms, max ${times[RUNS - 1].toFixed(0)} ms, faces ${faces}`);
      }
    }

    document.getElementById('btn-cam').addEventListener('click', async () => {
      const video = document.getElementById('video');
      video.hidden = false;
      const cam = await startCamera(video, {});
      await bench(`Camera ${cam.width}×${cam.height}`, () => grabFrame(video));
      stopCamera(video);
    });

    document.getElementById('file').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const bmp = await createImageBitmap(file);
      await bench(`Photo ${bmp.width}×${bmp.height}`, async () => ({ bitmap: await createImageBitmap(bmp) }));
    });
  </script>
</body>
</html>
